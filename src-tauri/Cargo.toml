[package]
name = "devops-desktop"
version = "0.1.0"
description = "DevOps Desktop — Central de SSH, Git e Deploy"
authors = ["Douglas"]
edition = "2021"
license = "MIT"
repository = "https://github.com/DouglasGDev/devops-desktop"

[lib]
name = "devops_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
glob = "0.3"
portable-pty = "0.8"

[profile.release]
codegen-units = 1
lto = true
strip = true
